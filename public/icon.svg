<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#122422"/>
      <stop offset="100%" stop-color="#0B1615"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#55A9A0"/>
      <stop offset="100%" stop-color="#287A74"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8B0"/>
      <stop offset="100%" stop-color="#AEEED3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#AEEED3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#287A74" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Shield Outline -->
  <g filter="url(#shadow)">
    <path d="M256 80 L392 136 C392 260 336 360 256 424 C176 360 120 260 120 136 Z" 
          fill="url(#shieldGrad)" 
          stroke="url(#glowGrad)" 
          stroke-width="12" 
          stroke-linejoin="round"/>
  </g>

  <!-- Inner Vault Lock / Keyhole -->
  <circle cx="256" cy="220" r="38" fill="url(#glowGrad)"/>
  <path d="M242 220 L270 220 L278 300 L234 300 Z" fill="url(#glowGrad)"/>

  <!-- Subtle Mint Sparkle -->
  <circle cx="256" cy="220" r="16" fill="#122422"/>
  <path d="M256 160 L256 180" stroke="#FFF8B0" stroke-width="6" stroke-linecap="round"/>
</svg>
